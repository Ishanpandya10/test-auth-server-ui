<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="590" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2b4a">SMVS Authentication &amp; Routing — End-to-End Flow</text>

  <!-- Legend -->
  <rect x="20" y="48" width="14" height="14" fill="#d9ead3" stroke="#38761d"/>
  <text x="40" y="60" fill="#333">Legacy / existing (unchanged)</text>
  <rect x="250" y="48" width="14" height="14" fill="#cfe2f3" stroke="#1155cc"/>
  <text x="270" y="60" fill="#333">New / modified in this design</text>
  <rect x="470" y="48" width="14" height="14" fill="#fce5cd" stroke="#b45309"/>
  <text x="490" y="60" fill="#333">External party</text>

  <!-- React UI -->
  <rect x="60" y="100" width="180" height="70" rx="8" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="150" y="130" text-anchor="middle" font-weight="bold">React UI (SPA)</text>
  <text x="150" y="150" text-anchor="middle" font-size="11">holds legacy auth_token</text>

  <!-- Legacy monolith -->
  <rect x="60" y="300" width="180" height="80" rx="8" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="150" y="330" text-anchor="middle" font-weight="bold">global-old-backend</text>
  <text x="150" y="348" text-anchor="middle" font-size="11">monolith (JSP) — login</text>
  <text x="150" y="364" text-anchor="middle" font-size="11">writes user_sessions</text>

  <!-- External microservice -->
  <rect x="60" y="620" width="200" height="70" rx="8" fill="#fce5cd" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="648" text-anchor="middle" font-weight="bold">External team microservice</text>
  <text x="160" y="668" text-anchor="middle" font-size="11">AWS EC2 — client_credentials JWT</text>

  <!-- Gateway -->
  <rect x="420" y="120" width="300" height="300" rx="10" fill="#cfe2f3" stroke="#1155cc" stroke-width="2"/>
  <text x="570" y="146" text-anchor="middle" font-weight="bold" font-size="15">global-backend-gateway</text>
  <text x="570" y="164" text-anchor="middle" font-size="11">Spring Cloud Gateway (BFF + edge)</text>

  <rect x="440" y="180" width="260" height="110" rx="6" fill="#eaf2fb" stroke="#1155cc"/>
  <text x="570" y="200" text-anchor="middle" font-weight="bold" font-size="12">/app/** — BFF chain</text>
  <text x="570" y="218" text-anchor="middle" font-size="11">POST /app/session: exchange</text>
  <text x="570" y="233" text-anchor="middle" font-size="11">auth_token → JWT (server-side)</text>
  <text x="570" y="248" text-anchor="middle" font-size="11">SESSION cookie ↔ stored JWT</text>
  <text x="570" y="263" text-anchor="middle" font-size="11">relay JWT as Bearer downstream</text>
  <text x="570" y="281" text-anchor="middle" font-size="10" fill="#555">routes: /app/account-management, /app/spk-management</text>

  <rect x="440" y="300" width="260" height="100" rx="6" fill="#eaf2fb" stroke="#1155cc"/>
  <text x="570" y="320" text-anchor="middle" font-weight="bold" font-size="12">/ext/** — external chain</text>
  <text x="570" y="338" text-anchor="middle" font-size="11">pass-through (Bearer forwarded)</text>
  <text x="570" y="353" text-anchor="middle" font-size="11">IP/CIDR allow-list (prod)</text>
  <text x="570" y="368" text-anchor="middle" font-size="11">rate limit 20 req/s, burst 40 / IP</text>
  <text x="570" y="386" text-anchor="middle" font-size="10" fill="#555">route: /ext/adapter/**</text>

  <!-- Auth server -->
  <rect x="820" y="120" width="300" height="150" rx="10" fill="#cfe2f3" stroke="#1155cc" stroke-width="2"/>
  <text x="970" y="146" text-anchor="middle" font-weight="bold" font-size="15">smvs-global-auth-server</text>
  <text x="970" y="164" text-anchor="middle" font-size="11">Spring Authorization Server</text>
  <text x="970" y="188" text-anchor="middle" font-size="11" font-weight="bold">POST /auth/exchange (new)</text>
  <text x="970" y="204" text-anchor="middle" font-size="10">validate auth_token vs user_sessions</text>
  <text x="970" y="218" text-anchor="middle" font-size="10">→ mint RS256 JWT (sub + roles)</text>
  <text x="970" y="238" text-anchor="middle" font-size="11">/oauth2/token (client_credentials)</text>
  <text x="970" y="254" text-anchor="middle" font-size="11">/oauth2/jwks (public keys)</text>

  <!-- Resource servers -->
  <rect x="820" y="330" width="300" height="60" rx="8" fill="#cfe2f3" stroke="#1155cc" stroke-width="1.5"/>
  <text x="970" y="355" text-anchor="middle" font-weight="bold">account-management</text>
  <text x="970" y="373" text-anchor="middle" font-size="11">resource server — verifies JWT via JWKS</text>

  <rect x="820" y="410" width="300" height="60" rx="8" fill="#cfe2f3" stroke="#1155cc" stroke-width="1.5"/>
  <text x="970" y="435" text-anchor="middle" font-weight="bold">spk-management</text>
  <text x="970" y="453" text-anchor="middle" font-size="11">resource server — verifies JWT via JWKS</text>

  <rect x="820" y="620" width="300" height="60" rx="8" fill="#cfe2f3" stroke="#1155cc" stroke-width="1.5"/>
  <text x="970" y="645" text-anchor="middle" font-weight="bold">global-backend-thirdparty-adapter</text>
  <text x="970" y="663" text-anchor="middle" font-size="11">resource server — verifies JWT (issuer/JWKS)</text>

  <!-- user_sessions store -->
  <rect x="420" y="300" width="0" height="0"/>
  <ellipse cx="150" cy="470" rx="95" ry="28" fill="#f4f4f4" stroke="#666"/>
  <text x="150" y="468" text-anchor="middle" font-size="11" font-weight="bold">user_sessions</text>
  <text x="150" y="483" text-anchor="middle" font-size="10">shared Postgres</text>

  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- UI login to monolith -->
  <line x1="150" y1="170" x2="150" y2="300" stroke="#38761d" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="156" y="240" font-size="10" fill="#38761d">1. login → auth_token</text>

  <!-- monolith writes sessions -->
  <line x1="150" y1="380" x2="150" y2="442" stroke="#38761d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- UI to gateway /app/session -->
  <line x1="240" y1="130" x2="440" y2="210" stroke="#1155cc" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="150" font-size="10" fill="#1155cc">2. POST /app/session {auth_token}</text>
  <text x="250" y="164" font-size="10" fill="#1155cc">+ cookie; later /app/** calls</text>

  <!-- gateway to auth-server exchange -->
  <line x1="720" y1="215" x2="820" y2="195" stroke="#1155cc" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="724" y="200" font-size="10" fill="#1155cc">3. /auth/exchange</text>

  <!-- auth-server validates session -->
  <line x1="820" y1="205" x2="245" y2="465" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="430" y="430" font-size="10" fill="#777">validate against user_sessions</text>

  <!-- gateway relay to resource servers -->
  <line x1="720" y1="250" x2="820" y2="350" stroke="#1155cc" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="300" font-size="10" fill="#1155cc">4. Bearer JWT</text>
  <line x1="720" y1="270" x2="820" y2="430" stroke="#1155cc" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- resource servers verify via jwks -->
  <line x1="970" y1="330" x2="970" y2="270" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="978" y="300" font-size="10" fill="#777">verify via /oauth2/jwks</text>

  <!-- external to auth-server for token -->
  <line x1="160" y1="620" x2="880" y2="258" stroke="#b45309" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="300" y="560" font-size="10" fill="#b45309">A. client_credentials → JWT</text>

  <!-- external to gateway /ext -->
  <line x1="260" y1="650" x2="440" y2="360" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="520" font-size="10" fill="#b45309">B. /ext/adapter/** + Bearer JWT</text>

  <!-- gateway /ext to adapter -->
  <line x1="700" y1="370" x2="820" y2="640" stroke="#1155cc" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712" y="520" font-size="10" fill="#1155cc">C. forward Bearer (pass-through)</text>

  <!-- adapter verify jwks -->
  <line x1="970" y1="620" x2="970" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
